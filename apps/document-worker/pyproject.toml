[project]
name = "reissue-worker"
version = "0.1.0"
description = "Reissue document worker: classifies and extracts shipment documents with source evidence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "openpyxl>=3.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "reportlab>=4.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reissue_worker"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/reissue_worker/fixtures.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "pytesseract", "openpyxl", "openpyxl.*", "reportlab.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
