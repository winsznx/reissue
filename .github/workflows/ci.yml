name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Install Tesseract for the OCR tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pnpm install --frozen-lockfile
      - name: Types, lint and build
        run: pnpm turbo run typecheck lint build
      - name: Unit tests
        run: pnpm turbo run test --filter='!@reissue/tests' --filter='!@reissue/document-worker'
      - name: Document worker tests
        working-directory: apps/document-worker
        timeout-minutes: 15
        env:
          OMP_THREAD_LIMIT: "1"
        run: uv run pytest -v --durations=15
